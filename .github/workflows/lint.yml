name: Lint

on:
  push:
    branches:
    - main
  pull_request:


permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Check linter configuration
      run: make lint-config
    - name: Run linter
      run: make lint

  api-docs:
    permissions:
      contents: read
    name: Check API reference is up to date
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Regenerate the API reference
      run: make api-docs
    - name: Fail on drift
      run: |
        git diff --exit-code docs/src/api-reference.md || {
          echo "::error file=docs/src/api-reference.md::The API reference is out of date. Run 'make api-docs' and commit the result."
          exit 1
        }

  vulncheck:
    permissions:
      contents: read
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run govulncheck
      run: make vulncheck
