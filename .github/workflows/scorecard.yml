name: Scorecard supply-chain security

on:
  # Re-evaluate whenever branch protection changes, weekly, and on pushes to main.
  branch_protection_rule:
  schedule:
  - cron: '0 2 * * 1'
  push:
    branches: [ main ]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed by publish_results to sign the results and publish them to the
      # public OpenSSF API that backs the README badge.
      id-token: write
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run analysis
      uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
      with:
        results_file: results.sarif
        results_format: sarif
        # Publishes results to the public OpenSSF API so the README badge and
        # https://scorecard.dev viewer can read them.
        publish_results: true

    - name: Upload SARIF artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scorecard-results
        path: results.sarif
        retention-days: 5

    - name: Upload to code-scanning
      uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
      with:
        sarif_file: results.sarif
