name: E2E Tests

on:
  schedule:
  - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: false
        type: string
      pr_sha:
        description: 'PR head SHA'
        required: false
        type: string

permissions: {}

concurrency:
  group: e2e-${{ github.event.inputs.pr_number || github.event_name }}
  # Cancel superseded PR/dispatch runs, but never cancel the nightly schedule.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  # Must be >= the kind release that builds the kindest/node images in
  # .github/kind_versions.json. v1.36.x node images use containerd config v4,
  # which only kind v0.32.0+ can read (older kind fails `kind load` with
  # "unknown containerd config version: 4"). Keep in sync with k8s_versions_scope.json.
  KIND_VERSION: v0.32.0
  # The manager image is built once per run by the build-images job and reused
  # by every lane on the same runner. The tag is per run (not per attempt) so a
  # "Re-run failed jobs" lane still finds the image the original build left.
  E2E_MANAGER_IMAGE: example.com/cnmsql:e2e-${{ github.run_id }}

jobs:
  generate-jobs:
    name: Generate E2E lane matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      kindMatrix: ${{ steps.generate.outputs.kindMatrix }}
      kindEnabled: ${{ steps.generate.outputs.kindEnabled }}
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Comment run URL
      if: github.event.inputs.pr_number != ''
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        gh api "repos/${{ github.repository }}/issues/${{ github.event.inputs.pr_number }}/comments" \
          -f body="E2E tests triggered for commit \`${{ github.event.inputs.pr_sha }}\` — [view run](${RUN_URL})" --silent || true
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Generate lanes
      id: generate
      run: |
        case "${{ github.event_name }}" in
          schedule)           mode=schedule ;;
          workflow_dispatch)  mode=workflow_dispatch ;;
          *)                  mode=pull_request ;;
        esac
        python3 .github/e2e-matrix-generator.py -m "$mode"

  register-pending:
    name: Register lane statuses
    needs: generate-jobs
    # Only PR dispatches carry a head SHA to attach statuses to; the nightly
    # schedule has none. Runs the moment the matrix is known so every lane shows
    # pending up front, instead of trickling in as each lane's runner is scheduled.
    if: needs.generate-jobs.outputs.kindEnabled == 'true' && github.event.inputs.pr_sha != ''
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
    - name: Mark every lane pending
      run: |
        echo '${{ needs.generate-jobs.outputs.kindMatrix }}' \
          | jq -r '.include[].id' \
          | while read -r lane; do
              gh api "repos/${{ github.repository }}/statuses/${{ github.event.inputs.pr_sha }}" \
                -f state="pending" \
                -f context="E2E / $lane" \
                -f description="Waiting for a runner" \
                -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --silent
            done
      env:
        GH_TOKEN: ${{ github.token }}

  build-images:
    name: Build E2E images
    needs: generate-jobs
    if: needs.generate-jobs.outputs.kindEnabled == 'true'
    runs-on: ${{ github.repository_owner == 'cnmsql' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    outputs:
      # The lanes pin themselves to this host to reuse its Docker image store.
      host: ${{ steps.host.outputs.label }}
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.pr_sha || github.ref }}

    # Runners on one host share its Docker daemon, so the image built here is
    # visible to all of them. Each runner of a multi-runner host sets
    # CNMSQL_E2E_HOST_LABEL in its .env file to a label every runner of that host
    # carries; a lone runner falls back to its own name.
    - name: Record host
      id: host
      run: echo "label=${CNMSQL_E2E_HOST_LABEL:-$RUNNER_NAME}" >> "$GITHUB_OUTPUT"

    - name: Remove stale E2E manager images
      run: |
        # Each run leaves its image behind so re-runs can reuse it; drop the ones
        # from runs older than two days so the persistent runner does not fill up.
        cutoff=$(date -d '2 days ago' +%s)
        docker image ls --filter "reference=example.com/cnmsql:e2e-*" --format '{{.Repository}}:{{.Tag}}' \
          | while read -r ref; do
              [[ "$ref" == "$E2E_MANAGER_IMAGE" ]] && continue
              created=$(date -d "$(docker image inspect -f '{{.Created}}' "$ref")" +%s)
              if (( created < cutoff )); then
                docker image rm "$ref" || true
              fi
            done

    - name: Build the manager image
      run: make docker-build IMG="$E2E_MANAGER_IMAGE"

    # Start the host's registry mirrors before any lane needs them (lanes also
    # run `up`, which is then a no-op).
    - name: Start registry mirrors
      if: github.repository_owner == 'cnmsql'
      run: ./hack/e2e-registry-mirrors.sh up

    # The lanes are skipped when the build fails, so fail their pending statuses
    # here or the PR would wait on them forever.
    - name: Fail every lane
      if: failure() && github.event.inputs.pr_sha != ''
      run: |
        echo '${{ needs.generate-jobs.outputs.kindMatrix }}' \
          | jq -r '.include[].id' \
          | while read -r lane; do
              gh api "repos/${{ github.repository }}/statuses/${{ github.event.inputs.pr_sha }}" \
                -f state="failure" \
                -f context="E2E / $lane" \
                -f description="E2E image build failed" \
                -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --silent
            done
      env:
        GH_TOKEN: ${{ github.token }}

  e2e:
    name: ${{ matrix.id }}
    needs: [generate-jobs, build-images]
    if: needs.generate-jobs.outputs.kindEnabled == 'true'
    # On the self-hosted pool every lane runs on the host that built the images,
    # so it loads them instead of rebuilding. Lanes run in parallel across that
    # host's runners, each with its own Kind cluster. GitHub matches runs-on
    # against labels, not runner names: see the Record host step.
    runs-on: ${{ github.repository_owner == 'cnmsql' && fromJSON(format('["self-hosted","{0}"]', needs.build-images.outputs.host)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      # Concurrent lanes share one host's memory: each runs its own Kind cluster
      # with up to `procs` MySQL clusters (~4 GiB each), so the cap is a memory
      # budget, not a runner count. 2 fits the 8 vCPU / 24 GiB runner host; tune
      # with the E2E_MAX_PARALLEL repository variable. GitHub-hosted lanes each
      # get their own VM and are not capped.
      max-parallel: ${{ github.repository_owner == 'cnmsql' && fromJSON(vars.E2E_MAX_PARALLEL || '2') || 32 }}
      matrix: ${{ fromJSON(needs.generate-jobs.outputs.kindMatrix) }}
    env:
      # Lane fields map straight onto the knobs the suite + hack/e2e.sh consume.
      K8S_VERSION: ${{ matrix.k8s_version }}
      E2E_MYSQL_VERSION: ${{ matrix.mysql_version }}
      E2E_MARIADB_VERSION: ${{ matrix.mariadb_version }}
      E2E_MAJOR_UPGRADE: ${{ matrix.major_upgrade }}
      GINKGO_LABEL_FILTER: ${{ matrix.label_filter }}
      GINKGO_PROCS: ${{ matrix.procs }}
      CERT_MANAGER_INSTALL_SKIP: "false"
      GINKGO_TIMEOUT: ${{ github.repository_owner == 'cnmsql' && '240m' || '120m' }}
      E2E_TIMEOUT_MULTIPLIER: ${{ github.repository_owner == 'cnmsql' && '2' || '1' }}
      E2E_JUNIT: test-results/junit.xml
      E2E_SHARED_SETUP: ${{ matrix.shared_setup }}
      # Load the image build-images left on this runner. GitHub-hosted lanes are
      # fresh VMs without it, so they build their own as before.
      E2E_PREBUILT_MANAGER_IMAGE: ${{ github.repository_owner == 'cnmsql' && 'true' || 'false' }}
      # Kind nodes pull through registry caches on the persistent host (see
      # hack/e2e-registry-mirrors.sh). Pointless on a throwaway GitHub VM.
      E2E_REGISTRY_MIRRORS: ${{ github.repository_owner == 'cnmsql' && 'true' || 'false' }}
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ github.event.inputs.pr_sha || github.ref }}

    # Lanes are marked pending up front by the register-pending job; this step
    # flips this lane from "waiting for a runner" to "running" once it starts.
    - name: Mark this lane running
      if: github.event.inputs.pr_sha != ''
      run: |
        gh api "repos/${{ github.repository }}/statuses/${{ github.event.inputs.pr_sha }}" \
          -f state="pending" \
          -f context="E2E / ${{ matrix.id }}" \
          -f description="E2E tests running" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # The self-hosted runner is persistent and already holds the module
        # cache, so restoring the Actions cache over it only fails file by file.
        cache: ${{ github.repository_owner != 'cnmsql' }}

    - name: Install kind
      run: |
        curl -fsSL -o ./kind \
          "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind
        kind version

    - name: Prepare runner
      run: |
        # Lanes of one run share a host and may run at once, so the cluster name
        # carries the lane's matrix index (the lane id would push the dedicated
        # clusters' node names past the 63-char hostname limit). The kubeconfig
        # and temp files live in the runner's own temp dir: kind switches the
        # current context, and the suite writes manifests to os.TempDir().
        {
          echo "KIND_CLUSTER=cnmsql-e2e-${GITHUB_RUN_ID}-${{ strategy.job-index }}"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig"
          echo "TMPDIR=${RUNNER_TEMP}"
        } >> "$GITHUB_ENV"
        ./hack/e2e-ci-hygiene.sh prepare "cnmsql-e2e-${GITHUB_RUN_ID}-${{ strategy.job-index }}"

    - name: Run e2e lane ${{ matrix.id }} (k8s ${{ matrix.k8s_version }}, MySQL ${{ matrix.mysql_version }})
      run: |
        mkdir -p test-results
        set -o pipefail
        make test-e2e 2>&1 | tee "test-results/run.log"

    - name: Update status
      if: always() && github.event.inputs.pr_sha != ''
      run: |
        if [[ "${{ job.status }}" == "success" ]]; then
          STATE="success"
          DESC="E2E tests passed"
        else
          STATE="failure"
          DESC="E2E tests failed"
        fi
        gh api "repos/${{ github.repository }}/statuses/${{ github.event.inputs.pr_sha }}" \
          -f state="$STATE" \
          -f context="E2E / ${{ matrix.id }}" \
          -f description="$DESC" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-${{ matrix.id }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Cleanup after e2e
      if: always() && env.KIND_CLUSTER != ''
      # Delete this lane's shared suite cluster and the ephemeral clusters its
      # disruptive specs provisioned (<KIND_CLUSTER>-<slug>), and nothing else:
      # other lanes may be running on this host.
      run: ./hack/e2e-ci-hygiene.sh cleanup "$KIND_CLUSTER"
