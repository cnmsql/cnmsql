name: Release

on:
  push:
    tags:
    - v*

permissions: {}

jobs:
  goreleaser:
    name: Release kubectl-cnmsql
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed for cosign keyless signing via the GitHub Actions OIDC identity.
      id-token: write
    steps:
    - name: Clone the code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Generate release notes
      id: git-cliff
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
      with:
        config: cliff.toml
        args: --latest --strip header --output RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean --release-notes=RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Announce release on PRs
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Comment on shipped PRs
      uses: apexskier/github-release-commenter@e7813a9625eabd79a875b4bc4046cfcae377ab34 # v1.4.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        release-tag: ${{ github.ref_name }}
        comment-template: |
          🚀 This shipped in **{release_tag}** — thanks for contributing!

          {release_link}
        label-template: |
          released
