name: E2E Flake Hunt

# Proactively surfaces flaky specs by repeating a lane several times, so flakes
# are found by CI rather than by contributors. It is NON-BLOCKING: it posts no
# commit statuses and is never a required check. Quarantined (`flaky`-labelled)
# specs are excluded from the gate lanes (see .github/e2e-matrix-generator.py)
# and can be exercised here with `tier: flaky`.
#
# See design/025-e2e-testing-overhaul.md.

on:
  schedule:
  # 04:00 UTC — offset from the main E2E nightly (01:00) so they do not contend
  # for the single self-hosted runner.
  - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to hunt (smoke|feature|flavor|heavy|disruptive|flaky)'
        required: false
        default: 'smoke'
        type: string
      repeat:
        description: 'Extra reruns (ginkgo --repeat); total runs = repeat + 1'
        required: false
        default: '2'
        type: string

permissions: {}

concurrency:
  group: e2e-flake-hunt
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0

jobs:
  hunt:
    name: Flake hunt (${{ github.event.inputs.tier || 'smoke' }})
    runs-on: ${{ github.repository_owner == 'cnmsql' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      GINKGO_TIMEOUT: ${{ github.repository_owner == 'cnmsql' && '240m' || '120m' }}
      E2E_TIMEOUT_MULTIPLIER: ${{ github.repository_owner == 'cnmsql' && '2' || '1' }}
      E2E_JUNIT: test-results/junit.xml
      GINKGO_EXTRA_ARGS: --repeat=${{ github.event.inputs.repeat || '2' }}
      E2E_REGISTRY_MIRRORS: ${{ github.repository_owner == 'cnmsql' && 'true' || 'false' }}
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # The self-hosted runner is persistent and already holds the module
        # cache, so restoring the Actions cache over it only fails file by file.
        cache: ${{ github.repository_owner != 'cnmsql' }}

    - name: Install kind
      run: |
        curl -fsSL -o ./kind \
          "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind
        kind version

    - name: Prepare runner
      run: |
        # Other e2e jobs may share this host: keep the kubeconfig and temp files
        # in this runner's temp dir and only sweep this job's clusters (see
        # e2e.yml).
        {
          echo "KIND_CLUSTER=cnmsql-flake-${GITHUB_RUN_ID}"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig"
          echo "TMPDIR=${RUNNER_TEMP}"
        } >> "$GITHUB_ENV"
        ./hack/e2e-ci-hygiene.sh prepare "cnmsql-flake-${GITHUB_RUN_ID}"

    - name: Flake hunt
      run: |
        mkdir -p test-results
        set -o pipefail
        # `flaky` tier may legitimately match no specs; allow that without failing.
        if [[ "${{ github.event.inputs.tier || 'smoke' }}" == "flaky" ]]; then
          export GINKGO_EXTRA_ARGS="$GINKGO_EXTRA_ARGS --allow-empty"
        fi
        ./hack/e2e.sh --tier "${{ github.event.inputs.tier || 'smoke' }}" 2>&1 | tee test-results/run.log

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-flake-hunt-${{ github.event.inputs.tier || 'smoke' }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Cleanup
      if: always() && env.KIND_CLUSTER != ''
      run: ./hack/e2e-ci-hygiene.sh cleanup "$KIND_CLUSTER"
