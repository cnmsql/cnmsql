apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-queries
data:
  queries.yaml: |
    app_items:
      query: "SELECT COUNT(*) AS total FROM app.items"
      metrics:
        - total:
            usage: GAUGE
            description: Rows in app.items
---
apiVersion: mysql.cnmsql.co/v1alpha1
kind: Cluster
metadata:
  labels:
    app.kubernetes.io/name: cnmsql
    app.kubernetes.io/managed-by: kustomize
  name: cluster-monitoring
spec:
  instances: 2
  imageName: ghcr.io/cnmsql/cnmsql-instance:8.4
  storage:
    size: 1Gi
  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: cluster-monitoring-queries
        key: queries.yaml
    privileges:
      - privileges: [SELECT]
        on: app.*
  bootstrap:
    initdb:
      database: app
      owner: app
