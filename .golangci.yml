version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    goconst:
      # Boolean-style server/DSN values read better inline than as constants.
      ignore-string-values:
        - "^(true|false|ON|OFF)$"
    modernize:
      disable:
        - omitzero
        # Flattening ObjectMeta into promoted-field literals hurts readability
        # of Kubernetes object construction.
        - embedlit
  exclusions:
    generated: lax
    rules:
      # Tests repeat literal fixtures (versions, GTIDs, column names) on purpose.
      - linters:
          - goconst
        path: _test\.go
      # kubectl plugin table headers ("Name", "Role", ...) are UI text.
      - linters:
          - goconst
        path: cmd/kubectl-cnmsql/
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
