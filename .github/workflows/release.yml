name: Release

on:
  push:
    tags:
    - v*

permissions: {}

jobs:
  goreleaser:
    name: Release kubectl-cnmsql
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed for cosign keyless signing via the GitHub Actions OIDC identity.
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
    - name: Clone the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Generate release notes
      id: git-cliff
      uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
      with:
        config: cliff.toml
        args: --latest --strip header --output RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}

    - name: Run GoReleaser
      id: goreleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean --release-notes=RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # checksums.txt lists every release archive in sha256sum format, which is
    # exactly what the SLSA generator takes as its subjects.
    - name: Generate provenance subjects
      id: hash
      env:
        ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
      run: |
        set -euo pipefail
        checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type == "Checksum") | .path')
        echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"

  provenance:
    name: Generate SLSA provenance
    needs: goreleaser
    permissions:
      # Needed to read the workflow path.
      actions: read
      # Needed to sign the provenance via the GitHub Actions OIDC identity.
      id-token: write
      # Needed to attach the provenance to the release.
      contents: write
    # Must be referenced by tag, not SHA: slsa-verifier rejects provenance from
    # a generator pinned by digest. Scorecard's Pinned-Dependencies check makes
    # an exception for this workflow, and renovate.json5 keeps it unpinned.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      provenance-name: kubectl-cnmsql.intoto.jsonl
      upload-assets: true

  announce:
    name: Announce release on PRs
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Comment on shipped PRs
      uses: apexskier/github-release-commenter@e7813a9625eabd79a875b4bc4046cfcae377ab34 # v1.4.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        release-tag: ${{ github.ref_name }}
        comment-template: |
          🚀 This shipped in **{release_tag}** — thanks for contributing!

          {release_link}
        label-template: |
          released
