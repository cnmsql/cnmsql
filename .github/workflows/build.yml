name: Build & Deploy

on:
  push:
    branches:
    - main
    tags:
    - v*
  workflow_dispatch:


permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-operator:
    name: Operator image (cnmsql)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for cosign keyless signing via the GitHub Actions OIDC identity.
      id-token: write
    steps:
    - name: Clone the code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Install cosign
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

    - name: Log in to ${{ env.REGISTRY }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image tags
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cnmsql
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,format=short

    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Every tag points at the same multi-platform index, so signing its digest
    # covers them all. Keyless: the certificate is recorded in the public Rekor
    # transparency log.
    - name: Sign the image
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cnmsql
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign sign --yes "${IMAGE}@${DIGEST}"
