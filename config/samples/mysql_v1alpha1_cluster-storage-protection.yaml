apiVersion: mysql.cnmsql.co/v1alpha1
kind: Cluster
metadata:
  labels:
    app.kubernetes.io/name: cnmsql
    app.kubernetes.io/managed-by: kustomize
  name: cluster-storage-protection
spec:
  instances: 3
  imageName: ghcr.io/cnmsql/cnmsql-instance:8.4
  storage:
    size: 10Gi
  # Opt-in storage protection (design/042): when the writable primary's data
  # volume reaches 90% used (or no space is left to unprivileged writers), the
  # instance manager holds it read-only until usage drops 5 points below the
  # threshold. Remove the stanza entirely to turn the feature off.
  storageProtection:
    readOnlyOnPressure: true
    readOnlyThresholdPercent: 90
